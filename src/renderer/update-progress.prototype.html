<!doctype html>
<!-- PROTOTYPE, throw me away. Five variants of install progress for the update notice
     (src/renderer/update-notice.tsx), switchable via ?variant= and the bottom bar. -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Install progress prototype</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400..700&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap"
      rel="stylesheet"
    />
    <style>
      /* Tokens copied from styles.css. */
      :root {
        --canvas: #fbf8f1;
        --ink: #191713;
        --on-ink: #fbf8f1;
        --text-muted: #6b6355;
        --text-faint: #8b8371;
        --border-strong: #191713;
        --hairline: #ddd6c6;
        --track: #e5decd;
        --fill: #191713;
        --accent: #a33418;
        --ok: oklch(0.47 0.1 155);
        --danger: oklch(0.51 0.19 25);
        --danger-surface: #f6e7e1;
        --danger-ink: #6d2412;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          color-scheme: dark;
          --canvas: #0a0a0a;
          --ink: oklch(0.898 0.022 42.6);
          --on-ink: oklch(0.134 0.006 354.5);
          --text-muted: oklch(0.665 0.025 33);
          --text-faint: oklch(0.575 0.025 31);
          --border-strong: oklch(0.365 0.03 15);
          --hairline: oklch(0.205 0.018 15);
          --track: oklch(0.175 0.018 15);
          --fill: oklch(0.898 0.022 42.6);
          --accent: oklch(0.639 0.222 20.3);
          --ok: oklch(0.714 0.107 166.6);
          --danger: oklch(0.716 0.181 13.8);
          --danger-surface: oklch(0.216 0.055 9.8);
          --danger-ink: oklch(0.82 0.104 9.8);
        }
      }
      :root[data-theme="dark"] {
        color-scheme: dark;
        --canvas: #0a0a0a;
        --ink: oklch(0.898 0.022 42.6);
        --on-ink: oklch(0.134 0.006 354.5);
        --text-muted: oklch(0.665 0.025 33);
        --text-faint: oklch(0.575 0.025 31);
        --border-strong: oklch(0.365 0.03 15);
        --hairline: oklch(0.205 0.018 15);
        --track: oklch(0.175 0.018 15);
        --fill: oklch(0.898 0.022 42.6);
        --accent: oklch(0.639 0.222 20.3);
        --ok: oklch(0.714 0.107 166.6);
        --danger: oklch(0.716 0.181 13.8);
        --danger-surface: oklch(0.216 0.055 9.8);
        --danger-ink: oklch(0.82 0.104 9.8);
      }

      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        padding: 24px 16px 140px;
        font-family: "Inter Tight", ui-sans-serif, system-ui, sans-serif;
        color: var(--ink);
        background: color-mix(in oklch, var(--canvas), var(--ink) 6%);
      }
      .window {
        position: relative;
        width: 100%;
        max-width: 440px;
        height: 620px;
        margin: 0 auto;
        overflow: hidden;
        background: var(--canvas);
        box-shadow: 0 0 0 1px var(--hairline), 0 12px 40px rgb(0 0 0 / 0.15);
      }
      main { padding: 26px; }
      header {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 16px;
        padding-bottom: 16px;
        border-bottom: 2px solid var(--border-strong);
      }
      h1 {
        margin: 0;
        font-family: Newsreader, Georgia, serif;
        font-size: 1.75rem;
        font-weight: 500;
        letter-spacing: -0.01em;
      }
      p { margin: 0; }
      .status { margin: 4px 0 0; font-size: 0.76rem; color: var(--text-muted); }
      .header-actions { display: flex; gap: 8px; }
      button {
        min-height: 32px;
        padding: 0 14px;
        border: 1px solid var(--border-strong);
        border-radius: 0;
        background: transparent;
        color: var(--ink);
        font: inherit;
        font-size: 0.78rem;
        font-weight: 600;
        cursor: pointer;
      }
      button:hover:not(:disabled) { background: var(--ink); color: var(--on-ink); }
      button:disabled { cursor: wait; opacity: 0.6; }
      button.quiet { border-color: transparent; }
      .notice {
        margin: 14px 0 0;
        padding: 9px 11px;
        border-left: 3px solid var(--danger);
        background: var(--danger-surface);
        color: var(--danger-ink);
        font-size: 0.78rem;
        line-height: 1.4;
      }
      .update {
        position: relative;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        min-height: 50px;
        margin: 14px 0 0;
        padding: 9px 11px;
        border-left: 3px solid var(--accent);
        background: var(--track);
        font-size: 0.78rem;
      }
      .update-actions { display: flex; gap: 6px; }
      .figure {
        font-family: Newsreader, Georgia, serif;
        font-size: 2.1rem;
        font-weight: 500;
        line-height: 1;
        font-variant-numeric: tabular-nums;
      }
      .rule { position: relative; height: 3px; margin: 10px 0 12px; background: var(--track); overflow: hidden; }
      .rule-fill { display: block; height: 100%; background: var(--fill); transition: width 120ms linear; }
      /* A stage with no measurable progress slides a short segment instead of filling. */
      .rule[data-indeterminate] .rule-fill {
        position: absolute;
        width: 30% !important;
        animation: slide 1.1s ease-in-out infinite;
      }
      @keyframes slide {
        from { left: -30%; }
        to { left: 100%; }
      }
      .pace { font-size: 0.68rem; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; }
      .num { font-variant-numeric: tabular-nums; }
      .muted { color: var(--text-muted); }
      .faint { color: var(--text-faint); }

      .provider { padding: 18px 0 4px; border-bottom: 1px solid var(--hairline); }
      .entry-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 8px; }
      .entry-head h3 { margin: 0; font-size: 0.82rem; font-weight: 600; }
      .entry-head i { margin-left: 8px; font-style: normal; font-size: 0.72rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-faint); }

      /* A: the strip itself carries the bar along its bottom edge. */
      .strip-rule { position: absolute; left: 0; right: 0; bottom: 0; height: 2px; margin: 0; background: transparent; }
      .strip-rule .rule-fill { background: var(--accent); }

      /* B: full-window step list, same frame as the release notes page. */
      .page { position: absolute; inset: 0; display: flex; flex-direction: column; background: var(--canvas); }
      .page-body { flex: 1; overflow-y: auto; padding: 26px 26px 16px; }
      .page-footer {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        padding: 14px 26px;
        border-top: 2px solid var(--border-strong);
        font-size: 0.76rem;
        color: var(--text-muted);
      }
      .steps { list-style: none; margin: 0; padding: 0; }
      .steps li { display: grid; grid-template-columns: 28px 1fr auto; gap: 0 10px; padding: 16px 0; border-bottom: 1px solid var(--hairline); }
      .steps .n { font-family: Newsreader, Georgia, serif; font-size: 1.2rem; line-height: 1; }
      .steps .label { font-size: 0.86rem; font-weight: 600; }
      .steps .detail { font-size: 0.74rem; margin-top: 3px; }
      .steps .rule { grid-column: 2 / 4; margin: 10px 0 0; }
      .steps li[data-state="pending"] { color: var(--text-faint); }
      .steps li[data-state="failed"] .label, .steps li[data-state="failed"] .mark { color: var(--danger); }
      .steps li[data-state="done"] .mark { color: var(--ok); }

      /* C: a full-window takeover built around one large figure. */
      .takeover { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: center; padding: 26px 34px; background: var(--canvas); }
      .takeover .big { font-family: Newsreader, Georgia, serif; font-size: 5.5rem; font-weight: 500; line-height: 1; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; margin: 10px 0 4px; }
      .takeover .word { font-size: 3.2rem; }
      .takeover .rule { margin: 18px 0 22px; }
      .facts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 0; }
      .facts dt { font-size: 0.66rem; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-faint); }
      .facts dd { margin: 3px 0 0; font-size: 0.86rem; font-variant-numeric: tabular-nums; }
      .takeover .foot { position: absolute; left: 34px; right: 34px; bottom: 26px; font-size: 0.74rem; }

      /* D: the header's bottom border becomes the bar. */
      header.progress { border-bottom: 0; }
      .header-rule { height: 3px; margin: 0; background: var(--track); }
      .header-rule .rule-fill { background: var(--accent); }

      /* E: one bar split into the four stages, labelled underneath. */
      .update.segmented { display: block; }
      .segments { display: grid; grid-template-columns: 3.5fr 1.5fr 2fr 1.7fr; gap: 3px; margin: 10px 0 6px; }
      .segments .rule { margin: 0; }
      .segments .pace { font-size: 0.6rem; margin-top: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .seg[data-state="pending"] .pace { color: var(--text-faint); }
      .seg[data-state="done"] .pace { color: var(--text-muted); }
      .seg[data-state="failed"] .pace { color: var(--danger); }
      .seg[data-state="failed"] .rule-fill { background: var(--danger); }

      /* The prototype bar, deliberately not in the app's style. */
      .proto {
        position: fixed;
        left: 50%;
        bottom: 16px;
        transform: translateX(-50%);
        width: min(760px, calc(100vw - 32px));
        padding: 10px 12px;
        border-radius: 14px;
        background: #1d4ed8;
        color: white;
        font: 12px/1.4 ui-monospace, monospace;
        box-shadow: 0 8px 30px rgb(0 0 0 / 0.35);
        z-index: 10;
      }
      .proto .row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
      .proto .row + .row { margin-top: 8px; }
      .proto button, .proto select {
        min-height: 26px;
        padding: 0 9px;
        border: 1px solid rgb(255 255 255 / 0.4);
        border-radius: 8px;
        background: transparent;
        color: white;
        font: inherit;
      }
      .proto select option { color: black; }
      .proto button:hover:not(:disabled) { background: white; color: #1d4ed8; }
      .proto button[aria-pressed="true"] { background: white; color: #1d4ed8; }
      .proto .name { flex: 1; text-align: center; font-weight: 700; font-size: 13px; }
      .proto .state { opacity: 0.85; white-space: pre-wrap; }
    </style>
  </head>
  <body>
    <div class="window" id="window"></div>

    <div class="proto">
      <div class="row">
        <button data-proto="prev" title="Previous variant (←)">←</button>
        <span class="name" id="variant-name"></span>
        <button data-proto="next" title="Next variant (→)">→</button>
      </div>
      <div class="row">
        <button data-proto="play">▶ Play install</button>
        <span>freeze at:</span>
        <span id="freeze"></span>
      </div>
      <div class="row">
        <label>platform <select id="platform">
          <option value="linux">Linux (pkexec)</option>
          <option value="darwin">macOS</option>
          <option value="win32">Windows (NSIS)</option>
        </select></label>
        <label>fail at <select id="fail-at">
          <option value="">never</option>
          <option value="download">download</option>
          <option value="verify">verify</option>
          <option value="install">install</option>
        </select></label>
        <button data-proto="theme">theme</button>
      </div>
      <div class="row state" id="state"></div>
    </div>

    <script>
      const VARIANTS = [
        ["A", "Strip bar", "the notice strip grows a bar on its bottom edge"],
        ["B", "Step list", "a full-window page listing the four stages"],
        ["C", "Big figure", "a full-window takeover with a large percentage"],
        ["D", "Header rule", "the header's bottom border becomes the bar"],
        ["E", "Segmented strip", "one bar split into the four stages inside the strip"],
      ];
      const STAGES = ["download", "verify", "install", "relaunch"];
      const CURRENT = "0.0.17";
      const TARGET = "0.0.18";
      const TOTAL = 96.4e6;

      const params = new URLSearchParams(location.search);
      const S = {
        variant: VARIANTS.some(([k]) => k === params.get("variant")) ? params.get("variant") : "A",
        platform: "linux",
        failAt: "",
        stage: "idle", // idle | download | verify | install | relaunch | failed
        received: 0,
        speed: 0,
        failedStage: null,
        error: null,
      };
      let timer = null;

      const mb = (bytes) => (bytes / 1e6).toFixed(1);
      const fraction = () => (S.stage === "download" ? S.received / TOTAL : null);
      const pct = () => Math.floor((fraction() ?? 0) * 100);

      function stageLabel(stage) {
        if (stage === "download") return "Downloading";
        if (stage === "verify") return "Checking signature";
        if (stage === "install")
          return { linux: "Waiting for your password", darwin: "Replacing the app", win32: "Starting the installer" }[S.platform];
        return S.platform === "win32" ? "Handing over to the installer" : "Relaunching";
      }
      function stageShort(stage) {
        return { download: "Download", verify: "Verify", install: "Install", relaunch: "Relaunch" }[stage];
      }
      function stageDetail(stage) {
        if (stage === "download") return `${mb(S.received)} of ${mb(TOTAL)} MB`;
        if (stage === "verify") return "Matches the release signing key";
        if (stage === "install" && S.platform === "linux") return "Your system asks for an administrator password";
        if (stage === "relaunch") return `Opening v${TARGET}`;
        return "";
      }
      function stateOf(stage) {
        const active = S.stage === "failed" ? S.failedStage : S.stage;
        const i = STAGES.indexOf(stage);
        const j = STAGES.indexOf(active);
        if (j < 0) return "pending";
        if (i < j) return "done";
        if (i > j) return "pending";
        return S.stage === "failed" ? "failed" : "current";
      }
      /** 0..1 across the whole install, weighting each stage by how long it usually takes. */
      function overall() {
        const weights = { download: 0.7, verify: 0.05, install: 0.2, relaunch: 0.05 };
        let sum = 0;
        for (const stage of STAGES) {
          const st = stateOf(stage);
          if (st === "done") sum += weights[stage];
          else if (st === "current") sum += weights[stage] * (stage === "download" ? fraction() : 0.5);
        }
        return sum;
      }
      function rule(frac, cls = "rule") {
        return frac == null
          ? `<div class="${cls}" data-indeterminate><span class="rule-fill"></span></div>`
          : `<div class="${cls}"><span class="rule-fill" style="width:${(frac * 100).toFixed(1)}%"></span></div>`;
      }
      const busy = () => STAGES.includes(S.stage);

      // Shared mock of the main window. Only the parts each variant swaps are parameters.
      function page({ status = "Updated 2 minutes ago", headerClass = "", afterHeader = "", slot = "" } = {}) {
        return `<main>
          <header class="${headerClass}">
            <div><h1>Usage</h1><p class="status">${status}</p></div>
            <div class="header-actions"><button>Refresh</button><button>Settings</button></div>
          </header>
          ${afterHeader}
          ${slot}
          ${provider("Claude", "5-hour", 42, "under", "Under pace")}
          ${provider("Claude", "Weekly", 71, "on", "On pace")}
          ${provider("Codex", "5-hour", 18, "under", "Under pace")}
        </main>`;
      }
      function provider(name, window, used, pace, paceLabel) {
        return `<section class="provider">
          <div class="entry-head"><h3>${name}<i>${window}</i></h3><span class="pace muted">${paceLabel}</span></div>
          <div class="figure">${used}%</div>
          ${rule(used / 100)}
        </section>`;
      }
      function idleStrip() {
        return `<section class="update"><p>Version ${TARGET} is available.</p>
          <div class="update-actions"><button class="quiet">What's new</button><button data-action="install">Install update</button></div>
        </section>`;
      }
      const errorNotice = () => (S.stage === "failed" ? `<p class="notice" role="alert">${S.error}</p>` : "");

      const render = {
        A() {
          if (!busy()) return page({ slot: idleStrip() + errorNotice() });
          const f = fraction();
          return page({
            slot: `<section class="update">
              <p><b>${stageLabel(S.stage)}</b> <span class="muted">v${TARGET}${S.stage === "download" ? ` · ${mb(S.received)} of ${mb(TOTAL)} MB` : ""}</span></p>
              <span class="num muted">${f == null ? "" : pct() + "%"}</span>
              ${rule(f, "rule strip-rule")}
            </section>`,
          });
        },
        B() {
          if (S.stage === "idle") return page({ slot: idleStrip() });
          const items = STAGES.map((stage, i) => {
            const st = stateOf(stage);
            const mark = { done: "✓", current: stage === "download" ? pct() + "%" : "", pending: "", failed: "✕" }[st];
            const detail = st === "current" || st === "failed" ? stageDetail(stage) : st === "done" && stage === "download" ? `${mb(TOTAL)} MB` : "";
            return `<li data-state="${st}">
              <span class="n">${i + 1}</span>
              <div><div class="label">${st === "current" ? stageLabel(stage) : stageShort(stage)}</div>${detail ? `<div class="detail muted">${detail}</div>` : ""}</div>
              <span class="mark pace num">${mark}</span>
              ${st === "current" ? rule(stage === "download" ? fraction() : null) : ""}
            </li>`;
          }).join("");
          const footer =
            S.stage === "failed"
              ? `<p>Nothing was changed.</p><div class="update-actions"><button class="quiet" data-action="reset">Back</button><button data-action="install">Try again</button></div>`
              : `<p>Tantalus relaunches when this finishes.</p><button disabled>Installing</button>`;
          return (
            page({ slot: idleStrip() }) +
            `<div class="page">
              <div class="page-body">
                <header><div><h1>Installing</h1><p class="status">v${CURRENT} to v${TARGET}</p></div></header>
                ${errorNotice()}
                <ol class="steps">${items}</ol>
              </div>
              <div class="page-footer">${footer}</div>
            </div>`
          );
        },
        C() {
          if (!busy()) return page({ slot: idleStrip() + errorNotice() });
          const f = fraction();
          const step = STAGES.indexOf(S.stage) + 1;
          const left = S.speed ? Math.ceil((TOTAL - S.received) / S.speed) : 0;
          const facts =
            S.stage === "download"
              ? [["Received", `${mb(S.received)} MB`], ["Speed", `${mb(S.speed)} MB/s`], ["Left", `${left}s`]]
              : [["Step", `${step} of 4`], ["From", `v${CURRENT}`], ["To", `v${TARGET}`]];
          return (
            page() +
            `<div class="takeover">
              <span class="pace muted">${stageLabel(S.stage)}</span>
              <div class="big ${f == null ? "word" : ""}">${f == null ? `v${TARGET}` : pct() + "%"}</div>
              ${rule(f)}
              <dl class="facts">${facts.map(([k, v]) => `<div><dt>${k}</dt><dd>${v}</dd></div>`).join("")}</dl>
              <p class="foot faint">${S.platform === "linux" && S.stage === "install" ? "Enter your password in the system prompt." : "Tantalus relaunches when this finishes."}</p>
            </div>`
          );
        },
        D() {
          if (!busy()) return page({ slot: idleStrip() + errorNotice() });
          const f = fraction();
          return page({
            status: `<span style="color:var(--ink);font-weight:600">${stageLabel(S.stage)}</span> v${TARGET}${f == null ? "" : ` · <span class="num">${pct()}%</span>`}`,
            headerClass: "progress",
            afterHeader: rule(f, "rule header-rule"),
          });
        },
        E() {
          if (S.stage === "idle") return page({ slot: idleStrip() });
          const segs = STAGES.map((stage) => {
            const st = stateOf(stage);
            const frac = st === "done" || st === "failed" ? 1 : st === "pending" ? 0 : stage === "download" ? fraction() : null;
            const label = st === "done" ? `✓ ${stageShort(stage)}` : stageShort(stage);
            return `<div class="seg" data-state="${st}">${rule(frac)}<div class="pace">${label}</div></div>`;
          }).join("");
          const head =
            S.stage === "failed"
              ? `<p><b>Update failed</b></p><div class="update-actions"><button data-action="install">Try again</button></div>`
              : `<p><b>${stageLabel(S.stage)}</b> <span class="muted">${stageDetail(S.stage)}</span></p><span class="num muted">${Math.round(overall() * 100)}%</span>`;
          return page({
            slot: `<section class="update segmented">
              <div style="display:flex;justify-content:space-between;align-items:center;gap:12px">${head}</div>
              <div class="segments">${segs}</div>
            </section>${errorNotice()}`,
          });
        },
      };

      // Simulation of Updater.install: download streams, the rest are opaque steps.
      const STEP_MS = { verify: 900, install: 2600, relaunch: 1400 };
      const ERRORS = {
        download: "Could not install the update: the download returned 503",
        verify: "Could not install the update: the download failed its signature check",
        install: "Could not install the update: the password prompt was cancelled",
      };
      function stop() {
        clearInterval(timer);
        clearTimeout(timer);
        timer = null;
      }
      function fail(stage) {
        stop();
        S.stage = "failed";
        S.failedStage = stage;
        S.error = ERRORS[stage] ?? ERRORS.install;
        draw();
      }
      function play() {
        stop();
        Object.assign(S, { stage: "download", received: 0, speed: 0, failedStage: null, error: null });
        draw();
        let last = performance.now();
        timer = setInterval(() => {
          const now = performance.now();
          S.speed = 18e6 + Math.random() * 8e6;
          S.received = Math.min(TOTAL, S.received + (S.speed * (now - last)) / 1000);
          last = now;
          if (S.failAt === "download" && S.received > TOTAL * 0.55) return fail("download");
          if (S.received >= TOTAL) {
            stop();
            return next("verify");
          }
          draw();
        }, 80);
      }
      function next(stage) {
        S.stage = stage;
        draw();
        timer = setTimeout(() => {
          if (S.failAt === stage) return fail(stage);
          const i = STAGES.indexOf(stage);
          if (i < STAGES.length - 1) next(STAGES[i + 1]);
          else {
            S.stage = "idle";
            draw();
          }
        }, STEP_MS[stage]);
      }
      function freeze(stage) {
        stop();
        if (stage === "failed") return fail(S.failAt || "install");
        Object.assign(S, { stage, received: stage === "download" ? TOTAL * 0.38 : 0, speed: 21.3e6, failedStage: null, error: null });
        draw();
      }

      const win = document.getElementById("window");
      function draw() {
        win.innerHTML = render[S.variant]();
        const [key, name, blurb] = VARIANTS.find(([k]) => k === S.variant);
        document.getElementById("variant-name").textContent = `${key} (${name})`;
        document.getElementById("variant-name").title = blurb;
        document.getElementById("freeze").innerHTML = ["idle", ...STAGES, "failed"]
          .map((st) => `<button data-freeze="${st}" aria-pressed="${S.stage === st}">${st}</button>`)
          .join(" ");
        const { variant, platform, failAt, stage, failedStage, error } = S;
        document.getElementById("state").textContent = JSON.stringify({
          variant, platform, failAt: failAt || null, stage,
          download: `${mb(S.received)}/${mb(TOTAL)} MB`, overall: `${Math.round(overall() * 100)}%`, failedStage, error,
        });
      }
      function cycle(step) {
        const i = VARIANTS.findIndex(([k]) => k === S.variant);
        S.variant = VARIANTS[(i + step + VARIANTS.length) % VARIANTS.length][0];
        history.replaceState(null, "", `?variant=${S.variant}`);
        draw();
      }

      document.addEventListener("click", (event) => {
        const el = event.target.closest("[data-action],[data-proto],[data-freeze]");
        if (!el) return;
        if (el.dataset.action === "install") play();
        if (el.dataset.action === "reset") freeze("idle");
        if (el.dataset.proto === "prev") cycle(-1);
        if (el.dataset.proto === "next") cycle(1);
        if (el.dataset.proto === "play") play();
        if (el.dataset.proto === "theme") {
          const root = document.documentElement;
          const dark = root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
          root.dataset.theme = dark ? "light" : "dark";
        }
        if (el.dataset.freeze) freeze(el.dataset.freeze);
      });
      document.addEventListener("keydown", (event) => {
        if (event.target.closest("input,select,textarea,[contenteditable]")) return;
        if (event.key === "ArrowLeft") cycle(-1);
        if (event.key === "ArrowRight") cycle(1);
      });
      document.getElementById("platform").onchange = (event) => ((S.platform = event.target.value), draw());
      document.getElementById("fail-at").onchange = (event) => ((S.failAt = event.target.value), draw());
      draw();
    </script>
  </body>
</html>
