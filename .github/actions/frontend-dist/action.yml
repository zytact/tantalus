name: frontend dist
description: Build dist/, which tauri-build requires before any cargo command.
runs:
  using: composite
  steps:
    - uses: voidzero-dev/setup-vp@v1.17.0
      with:
        node-version: 24
        cache: true
        run-install: false
    - shell: bash
      run: |
        vp install --frozen-lockfile
        vp build
