name: linux tauri deps
description: Install the system libraries Tauri v2 needs on Linux runners.
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        # The runner image ships a Google Chrome apt repo that nothing here needs, and its index
        # keeps failing the hash check, which fails the whole update.
        sudo grep -rl dl.google.com /etc/apt/sources.list /etc/apt/sources.list.d 2>/dev/null |
          xargs -r sudo rm -f
        sudo apt-get update
        sudo apt-get install -y \
          libwebkit2gtk-4.1-dev \
          libappindicator3-dev \
          librsvg2-dev \
          libssl-dev \
          patchelf \
          build-essential \
          curl \
          wget \
          file
