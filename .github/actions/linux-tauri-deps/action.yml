name: linux tauri deps
description: Install the system libraries Tauri v2 needs on Linux runners.
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libwebkit2gtk-4.1-dev \
          libappindicator3-dev \
          librsvg2-dev \
          libssl-dev \
          patchelf \
          build-essential \
          curl \
          wget \
          file
