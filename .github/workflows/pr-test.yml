name: test

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vitest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: voidzero-dev/setup-vp@v1.17.0
        with:
          node-version: 24
          cache: true
          run-install: false
      - run: vp install --frozen-lockfile
      - run: vp test
