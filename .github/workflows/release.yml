name: release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Draft release to build and publish (e.g. v0.1.0), for when a release run failed. Leave empty for a dry run that only uploads the bundles as workflow artifacts.
        type: string
        default: ""

jobs:
  release-please:
    if: github.event_name == 'push'
    concurrency: release-please
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      created: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v5

  bundle:
    needs: release-please
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || needs.release-please.outputs.created == 'true') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # deb + rpm
          - platform: ubuntu-22.04
          # dmg to install, tar.gz for the updater
          - platform: macos-latest
          # exe (NSIS installer)
          - platform: windows-latest

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag || inputs.tag || github.ref }}

      - uses: ./.github/actions/setup-frontend

      # electron-builder assembles the rpm with rpmbuild.
      - if: startsWith(matrix.platform, 'ubuntu')
        run: sudo apt-get install -y rpm

      - run: vp run package

      - if: startsWith(matrix.platform, 'ubuntu')
        run: |
          if rpm -qpl release/tantalus/*.rpm | grep -q '^/usr/lib/.build-id/'; then
            echo "::error::RPM contains global build-id links"
            exit 1
          fi

      # The updater accepts only bundles signed with the same key as the Tauri releases. Without it the
      # bundles still build, but publishing fails for want of signatures.
      - shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::warning::TAURI_SIGNING_PRIVATE_KEY is not set, so the bundles are unsigned"
            exit 0
          fi
          shopt -s nullglob
          node scripts/sign-update.ts release/tantalus/*.deb release/tantalus/*.rpm release/tantalus/*.tar.gz release/tantalus/*-setup.exe

      - uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.platform }}
          retention-days: 7
          if-no-files-found: error
          path: |
            release/tantalus/*.deb
            release/tantalus/*.rpm
            release/tantalus/*.dmg
            release/tantalus/*.tar.gz
            release/tantalus/*-setup.exe
            release/tantalus/*.sig

  publish:
    if: ${{ !cancelled() && needs.bundle.result == 'success' && (needs.release-please.outputs.created == 'true' || inputs.tag != '') }}
    needs: [release-please, bundle]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag || inputs.tag }}

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - uses: actions/download-artifact@v4
        with:
          pattern: bundle-*
          path: bundles
          merge-multiple: true

      - env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag || inputs.tag }}
        # latest.json is what installed apps read from the latest release. Each platform key names
        # the bundle that app was installed from, so an rpm install never downloads the deb. The release
        # stays a draft until every asset is up, so apps never see a latest release without latest.json.
        run: |
          shopt -s nullglob
          platforms='{}'
          for bundle in bundles/*.deb bundles/*.rpm bundles/*.tar.gz bundles/*-setup.exe; do
            name=$(basename "$bundle")
            [ -f "$bundle.sig" ] || { echo "::error::$name is not signed"; exit 1; }
            case "$name" in
              *_amd64.deb) key=linux-x86_64-deb ;;
              *.x86_64.rpm) key=linux-x86_64-rpm ;;
              *.tar.gz) key=darwin-aarch64 ;;
              *-setup.exe) key=windows-x86_64 ;;
              *) echo "::error::no updater platform for $name"; exit 1 ;;
            esac
            platforms=$(jq --arg key "$key" --arg url "https://github.com/$GH_REPO/releases/download/$TAG/$name" \
              --rawfile signature "$bundle.sig" '.[$key] = {url: $url, signature: ($signature | rtrimstr("\n"))}' <<<"$platforms")
          done
          node scripts/release-policy.ts "$TAG" "$GH_REPO" bundles/update-policy.json
          jq -n --arg version "${TAG#v}" --argjson platforms "$platforms" --slurpfile policy bundles/update-policy.json \
            '{version: $version, pub_date: (now | todate), platforms: $platforms} + $policy[0]' > bundles/latest.json
          rm bundles/update-policy.json

          mapfile -t assets < <(find bundles -type f -print)
          gh release upload "$TAG" "${assets[@]}" --clobber
          gh release edit "$TAG" --title "Tantalus $TAG" --draft=false
