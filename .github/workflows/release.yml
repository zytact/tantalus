name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a draft GitHub release. Leave off for a dry run that only uploads the bundles as workflow artifacts.
        type: boolean
        default: false
      tag:
        description: Tag to publish under (e.g. v0.1.0). Required only when publish is on.
        type: string
        default: ""

env:
  PUBLISH: ${{ github.event_name == 'push' || inputs.publish }}

jobs:
  bundle:
    strategy:
      fail-fast: false
      matrix:
        include:
          # deb + rpm
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            args: --bundles deb,rpm
          # dmg, one per architecture
          - platform: macos-latest
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin --bundles dmg
          - platform: macos-latest
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin --bundles dmg
          # exe (NSIS installer)
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            args: --bundles nsis

    runs-on: ${{ matrix.platform }}
    permissions:
      contents: write

    steps:
      - if: env.PUBLISH == 'true' && github.event_name == 'workflow_dispatch' && inputs.tag == ''
        shell: bash
        run: |
          echo "::error::publish is on but no tag was given"
          exit 1

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: ./.github/actions/setup-frontend

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - if: startsWith(matrix.platform, 'ubuntu')
        uses: ./.github/actions/linux-tauri-deps

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}

      # tauri.release.conf.json turns on the updater artifacts: a .sig beside each installer, and an
      # .app.tar.gz for macOS. Signing them takes the private key, which a preview build never has.
      - uses: tauri-apps/tauri-action@v0
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tauriScript: vp run tauri
          args: ${{ matrix.args }} --config src-tauri/tauri.release.conf.json

      # Both macOS targets name their update archive Tantalus.app.tar.gz, and the publish job merges
      # every bundle into one directory, so each archive takes its architecture.
      - if: startsWith(matrix.platform, 'macos')
        shell: bash
        working-directory: src-tauri/target/${{ matrix.target }}/release/bundle/macos
        env:
          TARGET: ${{ matrix.target }}
        run: |
          for file in Tantalus.app.tar.gz Tantalus.app.tar.gz.sig; do
            mv "$file" "${file/Tantalus/Tantalus_${TARGET%%-*}}"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.target }}
          if-no-files-found: error
          path: |
            src-tauri/target/**/*.deb
            src-tauri/target/**/*.rpm
            src-tauri/target/**/*.dmg
            src-tauri/target/**/*setup.exe
            src-tauri/target/**/*.app.tar.gz
            src-tauri/target/**/*.sig

  publish:
    if: github.event_name == 'push' || inputs.publish
    needs: bundle
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: bundle-*
          path: bundles
          merge-multiple: true

      - env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
        # latest.json is what installed apps read from the latest release. Each platform key names
        # the bundle that app was installed from, so an rpm install never downloads the deb.
        run: |
          platforms='{}'
          while IFS= read -r sig; do
            name=$(basename "${sig%.sig}")
            case "$name" in
              *_amd64.deb) key=linux-x86_64-deb ;;
              *.x86_64.rpm) key=linux-x86_64-rpm ;;
              *_aarch64.app.tar.gz) key=darwin-aarch64 ;;
              *_x86_64.app.tar.gz) key=darwin-x86_64 ;;
              *-setup.exe) key=windows-x86_64 ;;
              *) echo "::error::no updater platform for $name"; exit 1 ;;
            esac
            platforms=$(jq --arg key "$key" --arg url "https://github.com/$GH_REPO/releases/download/$TAG/$name" \
              --rawfile signature "$sig" '.[$key] = {url: $url, signature: ($signature | rtrimstr("\n"))}' <<<"$platforms")
          done < <(find bundles -name '*.sig')
          jq -n --arg version "${TAG#v}" --argjson platforms "$platforms" \
            '{version: $version, pub_date: (now | todate), platforms: $platforms}' > bundles/latest.json

          mapfile -t assets < <(find bundles -type f -print)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${assets[@]}" --clobber
          else
            gh release create "$TAG" "${assets[@]}" --draft --title "Tantalus $TAG" --verify-tag --generate-notes
          fi
