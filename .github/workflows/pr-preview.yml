name: preview

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bundle:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            args: --bundles deb,rpm
          - platform: macos-latest
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin --bundles dmg
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            args: --bundles nsis

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-frontend

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - if: startsWith(matrix.platform, 'ubuntu')
        uses: ./.github/actions/linux-tauri-deps

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: preview-${{ matrix.target }}

      # tauri.preview.conf.json renames the app and moves its bundle identifier, so a preview
      # installs beside the release build and keeps its own settings, autostart entry and
      # single-instance lock. The cargo feature gives it the matching tray icon.
      - uses: tauri-apps/tauri-action@v0
        with:
          tauriScript: vp run tauri
          args: >-
            ${{ matrix.args }}
            --config src-tauri/tauri.preview.conf.json
            --features preview

      - uses: actions/upload-artifact@v4
        with:
          name: preview-${{ matrix.target }}
          if-no-files-found: error
          path: |
            src-tauri/target/**/*.deb
            src-tauri/target/**/*.rpm
            src-tauri/target/**/*.dmg
            src-tauri/target/**/*setup.exe

  comment:
    # A pull request from a fork gets a read-only token, so it keeps the artifacts without a
    # comment pointing at them.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    needs: bundle
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write

    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- preview-bundles -->';
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              marker,
              '### Preview build',
              '',
              `Bundles for ${context.payload.pull_request.head.sha.slice(0, 7)} are attached to [this run](${run}):`,
              '',
              '| Platform | Artifact |',
              '| --- | --- |',
              '| Linux | `preview-x86_64-unknown-linux-gnu` (deb, rpm) |',
              '| macOS (Apple silicon) | `preview-aarch64-apple-darwin` (dmg) |',
              '| Windows | `preview-x86_64-pc-windows-msvc` (nsis) |',
              '',
              'It installs as **Tantalus Preview** alongside a release install and keeps its own settings.',
            ].join('\n');

            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
            });
            const existing = comments.find((comment) => comment.body.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
